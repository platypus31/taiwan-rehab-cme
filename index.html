<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣復健醫學繼續教育活動彙整</title>
<meta name="description" content="彙整台灣復健醫學相關學會的繼續教育活動與積分資訊，可依地區、時間、積分、主題篩選。">
<meta property="og:type" content="website">
<meta property="og:title" content="台灣復健醫學繼續教育活動彙整">
<meta property="og:description" content="彙整各學會公告的復健醫學積分課程，可依時間、地區、積分、主題、主辦單位篩選，每天自動更新。">
<meta property="og:url" content="https://platypus31.github.io/taiwan-rehab-cme/">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#2b6a62">
<link rel="canonical" href="https://platypus31.github.io/taiwan-rehab-cme/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1>復健醫學 繼續教育活動</h1>
    <p class="tagline">彙整各學會公告的復健醫學積分課程 · 每天自動更新</p>
    <div class="stats" id="stats">
      <span class="stat"><b id="stat-count">–</b> 場活動</span>
      <span class="stat"><b id="stat-range">–</b></span>
      <span class="stat"><b id="stat-sources">–</b> 個來源</span>
      <span class="stat updated" id="stat-updated"></span>
    </div>
    <div class="notice" id="notice" hidden></div>
  </div>
</header>

<main class="wrap">
  <section class="filters" aria-label="篩選器">
    <div class="filter-row search-row">
      <input type="search" id="q" placeholder="搜尋標題、主辦單位、地點…" autocomplete="off">
      <button type="button" id="toggle" class="reset toggle" aria-expanded="false">篩選</button>
      <button type="button" id="reset" class="reset">清除</button>
    </div>

    <div class="filter-row">
      <span class="label">時間</span>
      <div class="chips" id="f-time"></div>
    </div>

    <div class="filter-row">
      <span class="label">地區</span>
      <div class="chips" id="f-region"></div>
    </div>

    <div class="filter-row">
      <span class="label">積分</span>
      <div class="chips" id="f-credit"></div>
    </div>

    <div class="filter-row">
      <span class="label">主題</span>
      <div class="chips" id="f-category"></div>
    </div>

    <div class="filter-row">
      <span class="label">主辦</span>
      <div class="chips" id="f-organizer"></div>
    </div>

    <div class="filter-row">
      <span class="label">來源</span>
      <div class="chips" id="f-source"></div>
    </div>

    <div class="filter-row sort-row">
      <span class="label">排序</span>
      <div class="chips" id="f-sort"></div>
      <span class="result-count" id="result-count"></span>
    </div>
  </section>

  <!-- 訂閱行事曆。
       🔴 刻意做成**選配**而不是預設推播：值班不一定每堂課都上得到，
       上不到的課進了日曆就只是雜訊，所以要不要訂閱由使用者自己按。
       🔴 訂閱範圍是**這一排自己的選項**，跟上面的篩選器完全無關 ——
       純靜態站沒有後端，只能事先產好幾份固定的 .ics，不可能為任意篩選組合即時產生。
       所以訂閱粒度必須是「使用者明確選的一份」，而不是跟著瀏覽動作偷偷改變
       （篩了南部去看、卻在不知情的狀況下訂到別的範圍，比沒有這個功能更糟）。
       說明文字由 app.js 寫上實際筆數，不寫死在這裡也不含糊帶過。 -->
  <section class="subscribe" id="subscribe" aria-label="訂閱行事曆" hidden>
    <div class="subscribe-scope">
      <span class="label">訂閱</span>
      <div class="chips" id="f-subscribe"></div>
    </div>
    <div class="subscribe-main">
      <a id="subscribe-link" class="subscribe-btn" href="#">訂閱到行事曆</a>
      <button type="button" id="subscribe-copy" class="subscribe-copy">複製訂閱網址</button>
    </div>
    <p class="subscribe-note" id="subscribe-note"></p>
  </section>

  <section id="list" class="list" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>沒有符合條件的活動，試著放寬篩選條件。</p>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>資料直接取自各學會官方網站公告，僅作彙整索引；<strong>報名與積分認定請以主辦單位公告為準</strong>。</p>
    <p>點選活動標題會連到該學會的原始頁面。</p>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
